name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Siblings (nim-acp, nim-agent-harbor, nim-everywhere) are cloned by
      # setup-dev-env at the revisions repro.lock pins. The old per-repo
      # `actions/checkout path: ../<sibling>` steps are refused by
      # actions/checkout ("Repository path ... is not under ..."), and they
      # took each sibling's default branch rather than the locked revision.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: Setup dev env (nix flavor)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      # `shell: bash` is load-bearing, not style. The default `run` shell is
      # `bash -e` WITHOUT pipefail, so `cmd | tee` takes tee's exit status and a
      # failing command was reported as a passing job. `shell: bash` selects
      # `bash --noprofile --norc -eo pipefail`.
      - run: dev-exec just test 2>&1 | tee test.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ join(matrix.runner, '-') }}
          path: test.log
  lint:
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Siblings (nim-acp, nim-agent-harbor, nim-everywhere) are cloned by
      # setup-dev-env at the revisions repro.lock pins. The old per-repo
      # `actions/checkout path: ../<sibling>` steps are refused by
      # actions/checkout ("Repository path ... is not under ..."), and they
      # took each sibling's default branch rather than the locked revision.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: Setup dev env (nix flavor)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      # See the note on the first tee'd step: without pipefail, `| tee` masks failure.
      - run: dev-exec just lint 2>&1 | tee lint.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-log-${{ join(matrix.runner, '-') }}
          path: lint.log
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      # See the note on the first tee'd step: without pipefail, `| tee` masks failure.
      - run: nix build .#default 2>&1 | tee nix-build.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-build-log-${{ join(matrix.runner, '-') }}
          path: nix-build.log
