name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: nim-agents

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          [
            [self-hosted, linux, x64],
            [self-hosted, linux, arm64],
            [self-hosted, macos, arm64],
          ]
    runs-on: ${{ matrix.runner }}
    env:
      NIM_CI_NAMESPACE: declared-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
    steps:
      - name: Claim exclusive declared CI workspace
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NIM_CI_NAMESPACE" =~ ^declared-ci-[0-9]+-[0-9]+-[A-Za-z0-9_-]+-[0-9]+$ ]]
          mkdir "$GITHUB_WORKSPACE/$NIM_CI_NAMESPACE"
      - uses: actions/checkout@v4
        with:
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-agents-bootstrap
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-everywhere
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-everywhere
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-acp
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-acp
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-agent-harbor
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-agent-harbor
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create declared Git exact-event checkout
        working-directory: ${{ env.NIM_CI_NAMESPACE }}/nim-agents-bootstrap
        shell: bash
        run: |
          nix run .#prepare-ci-checkout -- "$PWD" "$GITHUB_WORKSPACE/$NIM_CI_NAMESPACE/nim-agents" "${{ github.sha }}" "$GITHUB_WORKSPACE/$NIM_CI_NAMESPACE" > "$GITHUB_WORKSPACE/$NIM_CI_NAMESPACE/declared-checkout-test.json"
      - name: Capture initial checkout Git authority
        working-directory: ${{ env.NIM_CI_NAMESPACE }}/nim-agents
        shell: bash
        run: |
          mkdir -p .repro
          nix run .#capture-ci-checkout-authority -- .repro/ci-git-authority
      # `shell: bash` is load-bearing, not style. The default `run` shell is
      # `bash -e` WITHOUT pipefail, so `cmd | tee` takes tee's exit status and a
      # failing command was reported as a passing job. `shell: bash` selects
      # `bash --noprofile --norc -eo pipefail`.
      - name: Prepare exact selected Git samples
        working-directory: ${{ env.NIM_CI_NAMESPACE }}/nim-agents
        shell: bash
        run: GIT_OPTIONAL_LOCKS=0 nix run .#prepare-ci-hook-samples -- .repro/ci-git-authority > .repro/ci-sample-transition.json
      - run: nix develop --command just test 2>&1 | tee test.log
        working-directory: ${{ env.NIM_CI_NAMESPACE }}/nim-agents
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ join(matrix.runner, '-') }}
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-agents/test.log
      - name: Preserve initial Git authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-git-authority-test-${{ join(matrix.runner, '-') }}
          path: |
            ${{ env.NIM_CI_NAMESPACE }}/declared-checkout-test.json
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/*.tsv
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/*.sha256
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/git-image.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/templates-source.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/source-head.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/creator-umask-before.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/creator-umask-after.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/caller-shared-policy.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/probe-shared-policy.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/result.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-sample-transition.json
  lint:
    strategy:
      fail-fast: false
      matrix:
        runner:
          [
            [self-hosted, linux, x64],
            [self-hosted, linux, arm64],
            [self-hosted, macos, arm64],
          ]
    runs-on: ${{ matrix.runner }}
    env:
      NIM_CI_NAMESPACE: declared-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
    steps:
      - name: Claim exclusive declared CI workspace
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NIM_CI_NAMESPACE" =~ ^declared-ci-[0-9]+-[0-9]+-[A-Za-z0-9_-]+-[0-9]+$ ]]
          mkdir "$GITHUB_WORKSPACE/$NIM_CI_NAMESPACE"
      - uses: actions/checkout@v4
        with:
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-agents-bootstrap
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-everywhere
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-everywhere
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-acp
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-acp
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-agent-harbor
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-agent-harbor
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create declared Git exact-event checkout
        working-directory: ${{ env.NIM_CI_NAMESPACE }}/nim-agents-bootstrap
        shell: bash
        run: |
          nix run .#prepare-ci-checkout -- "$PWD" "$GITHUB_WORKSPACE/$NIM_CI_NAMESPACE/nim-agents" "${{ github.sha }}" "$GITHUB_WORKSPACE/$NIM_CI_NAMESPACE" > "$GITHUB_WORKSPACE/$NIM_CI_NAMESPACE/declared-checkout-lint.json"
      - name: Capture initial checkout Git authority
        working-directory: ${{ env.NIM_CI_NAMESPACE }}/nim-agents
        shell: bash
        run: |
          mkdir -p .repro
          nix run .#capture-ci-checkout-authority -- .repro/ci-git-authority
      # See the note on the first tee'd step: without pipefail, `| tee` masks failure.
      - name: Prepare exact selected Git samples
        working-directory: ${{ env.NIM_CI_NAMESPACE }}/nim-agents
        shell: bash
        run: GIT_OPTIONAL_LOCKS=0 nix run .#prepare-ci-hook-samples -- .repro/ci-git-authority > .repro/ci-sample-transition.json
      - run: nix develop --command just lint 2>&1 | tee lint.log
        working-directory: ${{ env.NIM_CI_NAMESPACE }}/nim-agents
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-log-${{ join(matrix.runner, '-') }}
          path: ${{ env.NIM_CI_NAMESPACE }}/nim-agents/lint.log
      - name: Preserve initial Git authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-git-authority-lint-${{ join(matrix.runner, '-') }}
          path: |
            ${{ env.NIM_CI_NAMESPACE }}/declared-checkout-lint.json
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/*.tsv
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/*.sha256
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/git-image.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/templates-source.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/source-head.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/creator-umask-before.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/creator-umask-after.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/caller-shared-policy.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/probe-shared-policy.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-git-authority/result.txt
            ${{ env.NIM_CI_NAMESPACE }}/nim-agents/.repro/ci-sample-transition.json
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          [
            [self-hosted, linux, x64],
            [self-hosted, linux, arm64],
            [self-hosted, macos, arm64],
          ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nim-agents
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      # See the note on the first tee'd step: without pipefail, `| tee` masks failure.
      - run: nix build .#default 2>&1 | tee nix-build.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-build-log-${{ join(matrix.runner, '-') }}
          path: nim-agents/nix-build.log
